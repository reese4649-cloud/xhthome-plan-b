    // Common Toast Alert Component
    function Toast({ message, visible }) {
      if (!visible) return null;
      return (

          <span>{message}</span>
        </div>
      );
    }

      const path = location.pathname;

      return (

              <div className="flex flex-col">
                <span className="text-base md:text-lg font-bold text-primary leading-tight tracking-tight">馨恒泰家居</span>
                <span className="text-[10px] text-secondary leading-none uppercase tracking-wider font-semibold">XHT Home</span>

              <Link
                to="/contact"
                className={`text-sm md:text-base transition-colors ${path === '/contact' ? 'text-primary font-semibold' : 'text-on-surface-variant hover:text-primary'}`}

    // ==========================================
    // MAIN APP COMPONENT WITH MEMORYROUTER
    // ==========================================
    function App() {
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [toastMsg, setToastMsg] = useState('');
      const [toastVisible, setToastVisible] = useState(false);

      const triggerNotification = (msg) => {
        setToastMsg(msg);
        setToastVisible(true);
        setTimeout(() => {
          setToastVisible(false);
        }, 2600);
      };

      return (
        <div className="flex flex-col min-h-screen bg-surface">
          <Header onOpenMobileMenu={() => setMobileMenuOpen(true)} />
          <MobileDrawer isOpen={mobileMenuOpen} onClose={() => setMobileMenuOpen(false)} />
          <Toast message={toastMsg} visible={toastVisible} />

          <main className="flex-1 w-full pt-16 md:pt-20">
            <Routes>
              <Route path="/" element={<HomePage onNotify={triggerNotification} />} />
              <Route path="/about" element={<AboutPage />} />
              <Route path="/careers" element={<CareersPage onNotify={triggerNotification} />} />
              <Route path="/contact" element={<ContactPage onNotify={triggerNotification} />} />
              {/* Fallback to Home */}
              <Route path="*" element={<HomePage onNotify={triggerNotification} />} />
            </Routes>
          </main>

          <Footer />
        </div>
      );
    }

    // Wrap with MemoryRouter as explicitly specified
    const container = document.getElementById('root');
    const root = createRoot(container);
    root.render(
      <MemoryRouter initialEntries={["/"]}>
        <App />
      </MemoryRouter>
    );
  </script>
